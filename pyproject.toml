[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmterm-prasannaba"
version = "0.1.1"
description = "A minimal terminal client for OpenAI-compatible LLM servers."
authors = [{ name = "Prasanna Badami" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "openai>=2.54.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/prasannaba/llmterm"
Repository = "https://github.com/prasannaba/llmterm"
Issues = "https://github.com/prasannaba/llmterm/issues"

[project.scripts]
llmterm = "llmterm.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
