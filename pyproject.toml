[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmterm"
version = "0.2.0"
description = "A minimal terminal client for OpenAI-compatible LLM servers."
authors = [{ name = "Prasanna Badami" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["llm", "openai-compatible", "terminal", "chat"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=2.54,<4",
    "python-dotenv>=1.2.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/prasannaba/llmterm"
Repository = "https://github.com/prasannaba/llmterm"
Issues = "https://github.com/prasannaba/llmterm/issues"

[project.scripts]
llmterm = "llmterm.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["PLR0911", "PLR0912", "PLR0915", "PLR2004"]
